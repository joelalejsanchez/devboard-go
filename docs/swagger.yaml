basePath: /api/v1
definitions:
  domain.Task:
    properties:
      assigneeID:
        description: '`json:"assinee_id"` // no obliga a crear desde un inicio la
          referencia'
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      description:
        description: '`json:"description"`'
        type: string
      id:
        description: '`json:"id"`'
        type: string
      projectID:
        description: '`json:"project_id"`'
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.TaskStatus'
        description: '`json:"status"`'
      title:
        description: '`json:"title"`'
        type: string
      updatedAt:
        type: string
    type: object
  domain.TaskStatus:
    enum:
    - todo
    - in_progress
    - done
    type: string
    x-enum-varnames:
    - TaskStatusTodo
    - TaskStatusInProgress
    - TaskStatusDone
  handlers.createTaskRequest:
    properties:
      project_id:
        type: string
      title:
        maxLength: 200
        minLength: 3
        type: string
    required:
    - project_id
    - title
    type: object
  handlers.createUserRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  handlers.healthResponse:
    properties:
      status:
        type: string
      version:
        type: string
    type: object
  handlers.taskAssignRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  handlers.taskListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Task'
        type: array
    type: object
  handlers.taskResponse:
    properties:
      created_by:
        type: string
      id:
        type: string
      project_id:
        type: string
      title:
        type: string
    type: object
  handlers.taskUpdateStatusRequest:
    properties:
      status:
        type: string
    type: object
  handlers.userResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  utils.ProblemDetails:
    properties:
      detail:
        type: string
      errors:
        items:
          $ref: '#/definitions/validator.ValidationError'
        type: array
      instance:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  validator.ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
host: localhost:8000
info:
  contact:
    name: Soporte Devboard Joel
  description: API REST para gestión de proyectos
  title: DEVBOARD API
  version: "0.1"
paths:
  /health:
    get:
      description: Verifica que el servidor este ejecutandose y respondiendo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.healthResponse'
      summary: Health check
      tags:
      - system
  /projects/{id}/tasks:
    get:
      description: Obtiene las tasks de un proyecto
      parameters:
      - description: ID del proyecto
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.taskListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ProblemDetails'
      summary: Get Tasks from Project
      tags:
      - tasks
  /tasks:
    post:
      description: Crea una tarea
      parameters:
      - description: Datos de la tarea
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.createTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.taskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ProblemDetails'
      summary: Create Task
      tags:
      - tasks
  /tasks/{id}:
    get:
      description: Obtiene un task por id
      parameters:
      - description: ID de la tarea
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.taskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ProblemDetails'
      summary: Get Task
      tags:
      - tasks
  /tasks/{id}/assign:
    put:
      description: Asigna una tarea a un usuario
      parameters:
      - description: Datos de la tarea
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.taskAssignRequest'
      - description: ID de la tarea
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.taskListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ProblemDetails'
      summary: Asignar tarea a usuario
      tags:
      - tasks
  /tasks/{id}/status:
    put:
      description: actualiza el estado de tarae
      parameters:
      - description: Datos de la tarea
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.taskUpdateStatusRequest'
      - description: ID de la tarea
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.taskListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ProblemDetails'
      summary: actualiza el estado de tarea
      tags:
      - tasks
  /users:
    post:
      description: Crea un usuario
      parameters:
      - description: Datos del usuario
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.userResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ProblemDetails'
      summary: Create User
      tags:
      - users
  /users/{id}:
    get:
      description: Obtiene un usuario por id
      parameters:
      - description: ID del usuario
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.userResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ProblemDetails'
      summary: Get User
      tags:
      - users
swagger: "2.0"
