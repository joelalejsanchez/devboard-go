basePath: /api/v1
definitions:
  devboard_internal_domain.TaskStatus:
    enum:
    - todo
    - in_progress
    - done
    type: string
    x-enum-varnames:
    - TaskStatusTodo
    - TaskStatusInProgress
    - TaskStatusDone
  devboard_internal_handlers_utils.PaginatedResponse-internal_handlers_taskResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_handlers.taskResponse'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  devboard_internal_handlers_utils.ProblemDetails:
    properties:
      detail:
        type: string
      errors:
        items:
          $ref: '#/definitions/devboard_internal_validator.ValidationError'
        type: array
      instance:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  devboard_internal_validator.ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  internal_handlers.assignTaskRequest:
    properties:
      assignee_id:
        type: string
    required:
    - assignee_id
    type: object
  internal_handlers.createTaskRequest:
    properties:
      description:
        maxLength: 2000
        type: string
      project_id:
        type: string
      title:
        maxLength: 200
        minLength: 3
        type: string
    required:
    - project_id
    - title
    type: object
  internal_handlers.createUserRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  internal_handlers.healthResponse:
    properties:
      status:
        type: string
      version:
        type: string
    type: object
  internal_handlers.taskResponse:
    properties:
      assinee_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      project_id:
        type: string
      status:
        $ref: '#/definitions/devboard_internal_domain.TaskStatus'
      title:
        type: string
      updated_at:
        type: string
    type: object
  internal_handlers.updateStatusRequest:
    properties:
      status:
        $ref: '#/definitions/devboard_internal_domain.TaskStatus'
    required:
    - status
    type: object
  internal_handlers.userResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
host: localhost:8000
info:
  contact:
    name: Soporte Devboard Joel
  description: API REST para gestión de proyectos
  title: DEVBOARD API
  version: "0.1"
paths:
  /health:
    get:
      description: Verifica que el servidor este ejecutandose y respondiendo
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.healthResponse'
      summary: Health check
      tags:
      - system
  /projects/{id}/tasks:
    get:
      description: Obtiene las tasks de un proyecto
      parameters:
      - description: ID del proyecto
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/devboard_internal_handlers_utils.PaginatedResponse-internal_handlers_taskResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/devboard_internal_handlers_utils.ProblemDetails'
      summary: Get Tasks from Project
      tags:
      - tasks
  /tasks:
    post:
      description: Crea una tarea
      parameters:
      - description: Datos de la tarea
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handlers.taskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/devboard_internal_handlers_utils.ProblemDetails'
      summary: Create Task
      tags:
      - tasks
  /tasks/{id}:
    get:
      description: Obtiene un task por id
      parameters:
      - description: ID de la tarea
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.taskResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/devboard_internal_handlers_utils.ProblemDetails'
      summary: Get Task
      tags:
      - tasks
  /tasks/{id}/assign:
    put:
      description: Asigna una tarea a un usuario
      parameters:
      - description: ID del asignado
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.assignTaskRequest'
      - description: ID de la tarea
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.taskResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/devboard_internal_handlers_utils.ProblemDetails'
      summary: Asignar tarea a usuario
      tags:
      - tasks
  /tasks/{id}/status:
    put:
      description: actualiza el estado de tarae
      parameters:
      - description: Datos de la tarea
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.updateStatusRequest'
      - description: ID de la tarea
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.taskResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/devboard_internal_handlers_utils.ProblemDetails'
      summary: actualiza el estado de tarea
      tags:
      - tasks
  /users:
    post:
      description: Crea un usuario
      parameters:
      - description: Datos del usuario
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handlers.userResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/devboard_internal_handlers_utils.ProblemDetails'
      summary: Create User
      tags:
      - users
  /users/{id}:
    get:
      description: Obtiene un usuario por id
      parameters:
      - description: ID del usuario
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.userResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/devboard_internal_handlers_utils.ProblemDetails'
      summary: Get User
      tags:
      - users
swagger: "2.0"
