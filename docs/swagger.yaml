basePath: /api/v1
definitions:
  AssignTaskRequest:
    properties:
      assignee_id:
        type: string
    required:
    - assignee_id
    type: object
  CreateTaskRequest:
    properties:
      description:
        maxLength: 2000
        type: string
      project_id:
        type: string
      title:
        maxLength: 200
        minLength: 3
        type: string
    required:
    - project_id
    - title
    type: object
  CreateUserRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  HealthResponse:
    properties:
      status:
        type: string
      version:
        type: string
    type: object
  PaginatedResponse-TaskResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/TaskResponse'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  PaginatedResponse-UserResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/UserResponse'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  ProblemDetails:
    properties:
      detail:
        type: string
      errors:
        items:
          $ref: '#/definitions/ValidationError'
        type: array
      instance:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  TaskResponse:
    properties:
      assinee_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      project_id:
        type: string
      status:
        $ref: '#/definitions/TaskStatus'
      title:
        type: string
      updated_at:
        type: string
    type: object
  TaskStatus:
    enum:
    - todo
    - in_progress
    - done
    type: string
    x-enum-varnames:
    - TaskStatusTodo
    - TaskStatusInProgress
    - TaskStatusDone
  UpdateStatusRequest:
    properties:
      status:
        $ref: '#/definitions/TaskStatus'
    required:
    - status
    type: object
  UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  registerRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 3
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  tokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
host: localhost:8000
info:
  contact:
    name: Soporte Devboard Joel
  description: REST API for project management.
  title: DEVBOARD API
  version: "0.1"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verifica credenciales y retorna tokens de acceso
      parameters:
      - description: Credenciales
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ProblemDetails'
      summary: Iniciar sesión
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoca el refresh token del usuario
      parameters:
      - description: Refresh token a revocar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/refreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Sin contenido
      summary: Cerrar sesión
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Renueva el par de tokens usando un refresh token válido
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ProblemDetails'
      summary: Renovar tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Crea un nuevo usuario y retorna tokens de acceso
      parameters:
      - description: Datos de registro
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/tokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ProblemDetails'
      summary: Registrar usuario
      tags:
      - auth
  /health:
    get:
      description: Reports whether the server is running and responding.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HealthResponse'
      summary: Health check
      tags:
      - system
  /projects/{id}/tasks:
    get:
      description: Returns the tasks that belong to a project.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedResponse-TaskResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
      summary: Get Tasks from Project
      tags:
      - tasks
  /tasks:
    post:
      description: Creates a task.
      parameters:
      - description: Task data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/TaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
      summary: Create Task
      tags:
      - tasks
  /tasks/{id}:
    get:
      description: Returns a task by its ID.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TaskResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
      summary: Get Task
      tags:
      - tasks
  /tasks/{id}/assign:
    put:
      description: Assigns a task to a user.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Assignee data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/AssignTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TaskResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
      summary: Assign a task to a user
      tags:
      - tasks
  /tasks/{id}/status:
    put:
      description: Changes the status of a task.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Task status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TaskResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
      summary: Update a task status
      tags:
      - tasks
  /users:
    get:
      description: Returns the all users from the system.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedResponse-UserResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ProblemDetails'
      summary: Get Users from system
      tags:
      - users
    post:
      description: Creates a user.
      parameters:
      - description: User data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
      summary: Create User
      tags:
      - users
  /users/{id}:
    get:
      description: Returns a user by ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ProblemDetails'
      summary: Get User
      tags:
      - users
swagger: "2.0"
